services:
  paopaodns-web:
    image: ${PAOPAODNS_WEB_IMAGE:-ghcr.io/lovest20018/paopaodns-webui:latest}
    container_name: paopaodns-web
    restart: unless-stopped
    volumes:
      # Bind mount example: replace with the host path used by your PaoPaoDNS /data.
      # - /opt/paopaodns/data:/data

      # Named volume example: replace with your existing PaoPaoDNS data volume name.
      - paopaodns-data:/data
    environment:
      - DATA_DIR=/data
      - WEB_UI_TOKEN=${WEB_UI_TOKEN:?set WEB_UI_TOKEN, e.g. openssl rand -hex 32}
      # Set WEB_UI_ALLOW_NO_AUTH=true to allow access without token (not recommended).
    ports:
      - "8080:8080"

volumes:
  # Mark the volume as external because it should already be created by PaoPaoDNS.
  # If you use a bind mount above instead, remove this volumes section.
  paopaodns-data:
    external: true
